<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ktor OAuth API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        
        label {
            font-weight: 500;
            color: #333;
            display: block;
            margin-top: 10px;
        }
        
        .output {
            background: #2d3748;
            color: #68d391;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .output.error {
            color: #fc8181;
        }
        
        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        .status.authenticated {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.unauthenticated {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .user-list {
            list-style: none;
            margin-top: 10px;
        }
        
        .user-item {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e0e0e0;
        }
        
        .user-item button {
            padding: 6px 12px;
            font-size: 0.9em;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Ktor OAuth API Test</h1>
            <p>Test your Google OAuth authentication and user management endpoints</p>
        </div>
        
        <div class="content">
            <!-- Authentication Section -->
            <div class="section">
                <h2>🔐 Authentication</h2>
                <div id="authStatus"></div>
                <button onclick="login()">Login with Google</button>
                <button onclick="checkAuth()">Check Authentication Status</button>
                <div id="authOutput" class="output" style="display:none;"></div>
            </div>
            
            <!-- Users Management Section -->
            <div class="section">
                <h2>👥 Users Management</h2>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 10px;">Get All Users</h3>
                    <button onclick="getUsers()">Get Users</button>
                    <div id="usersOutput" class="output" style="display:none;"></div>
                    <ul id="usersList" class="user-list"></ul>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 10px;">Get User by ID</h3>
                    <label for="getUserId">User ID:</label>
                    <input type="number" id="getUserId" placeholder="Enter user ID">
                    <button onclick="getUserById()">Get User</button>
                    <div id="getUserOutput" class="output" style="display:none;"></div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 10px;">Create New User</h3>
                    <label for="newUserId">User ID:</label>
                    <input type="number" id="newUserId" placeholder="Enter user ID">
                    <label for="newUserName">User Name:</label>
                    <input type="text" id="newUserName" placeholder="Enter user name">
                    <button onclick="createUser()">Create User</button>
                    <div id="createUserOutput" class="output" style="display:none;"></div>
                </div>
                
                <div>
                    <h3 style="margin-bottom: 10px;">Delete User</h3>
                    <label for="deleteUserId">User ID:</label>
                    <input type="number" id="deleteUserId" placeholder="Enter user ID">
                    <button onclick="deleteUser()">Delete User</button>
                    <div id="deleteUserOutput" class="output" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8080';
        
        // Authentication Functions
        function login() {
            window.location.href = `${API_BASE}/login`;
        }
        
        async function checkAuth() {
            const output = document.getElementById('authOutput');
            const status = document.getElementById('authStatus');
            
            try {
                const response = await fetch(`${API_BASE}/hello`, {
                    credentials: 'include'
                });
                
                const text = await response.text();
                
                output.style.display = 'block';
                output.className = 'output';
                output.textContent = `Status: ${response.status}\nResponse: ${text}`;
                
                if (response.ok) {
                    status.innerHTML = '<span class="status authenticated">✓ Authenticated</span>';
                } else {
                    status.innerHTML = '<span class="status unauthenticated">✗ Not Authenticated</span>';
                }
            } catch (error) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = `Error: ${error.message}`;
                status.innerHTML = '<span class="status unauthenticated">✗ Error</span>';
            }
        }
        
        // User Management Functions
        async function getUsers() {
            const output = document.getElementById('usersOutput');
            const list = document.getElementById('usersList');
            
            try {
                const response = await fetch(`${API_BASE}/data/users`, {
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                output.style.display = 'block';
                output.className = 'output';
                output.textContent = `Status: ${response.status}\nResponse:\n${JSON.stringify(data, null, 2)}`;
                
                // Display users in a nice list
                list.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(user => {
                        const li = document.createElement('li');
                        li.className = 'user-item';
                        li.innerHTML = `
                            <span><strong>ID:</strong> ${user.id} | <strong>Name:</strong> ${user.name}</span>
                            <button onclick="deleteUserById(${user.id})">Delete</button>
                        `;
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li class="user-item">No users found</li>';
                }
            } catch (error) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = `Error: ${error.message}`;
            }
        }
        
        async function getUserById() {
            const output = document.getElementById('getUserOutput');
            const userId = document.getElementById('getUserId').value;
            
            if (!userId) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = 'Please enter a user ID';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/data/users/${userId}`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    output.className = 'output';
                    output.textContent = `Status: ${response.status}\nResponse:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    const text = await response.text();
                    output.className = 'output error';
                    output.textContent = `Status: ${response.status}\nResponse: ${text}`;
                }
                output.style.display = 'block';
            } catch (error) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = `Error: ${error.message}`;
            }
        }
        
        async function createUser() {
            const output = document.getElementById('createUserOutput');
            const userId = document.getElementById('newUserId').value;
            const userName = document.getElementById('newUserName').value;
            
            if (!userId || !userName) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = 'Please enter both user ID and name';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/data/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        id: parseInt(userId),
                        name: userName
                    })
                });
                
                output.style.display = 'block';
                
                if (response.ok) {
                    output.className = 'output';
                    output.textContent = `Status: ${response.status}\nUser created successfully!`;
                    document.getElementById('newUserId').value = '';
                    document.getElementById('newUserName').value = '';
                    // Refresh the users list
                    setTimeout(getUsers, 500);
                } else {
                    const text = await response.text();
                    output.className = 'output error';
                    output.textContent = `Status: ${response.status}\nResponse: ${text}`;
                }
            } catch (error) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = `Error: ${error.message}`;
            }
        }
        
        async function deleteUser() {
            const output = document.getElementById('deleteUserOutput');
            const userId = document.getElementById('deleteUserId').value;
            
            if (!userId) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = 'Please enter a user ID';
                return;
            }
            
            await deleteUserById(userId);
        }
        
        async function deleteUserById(userId) {
            const output = document.getElementById('deleteUserOutput');
            
            try {
                const response = await fetch(`${API_BASE}/data/users/${userId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                output.style.display = 'block';
                
                if (response.ok) {
                    output.className = 'output';
                    output.textContent = `Status: ${response.status}\nUser ${userId} deleted successfully!`;
                    document.getElementById('deleteUserId').value = '';
                    // Refresh the users list
                    setTimeout(getUsers, 500);
                } else {
                    const text = await response.text();
                    output.className = 'output error';
                    output.textContent = `Status: ${response.status}\nResponse: ${text}`;
                }
            } catch (error) {
                output.style.display = 'block';
                output.className = 'output error';
                output.textContent = `Error: ${error.message}`;
            }
        }
        
        // Check authentication status on page load
        window.onload = function() {
            checkAuth();
        };
    </script>
</body>
</html>
